<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Points Board GUDLFT</title>
</head>

<body>
    <h1>Club Points Board</h1>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
    <table>
        <thead>
            <tr>
                <th>Club</th>
                <th>Points</th>
            </tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{ club['name'] }}</td>
                <td>{{ club['points'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a class="back-link" href="{{ url_for('main.index') }}">Home</a>
</body>

</html>
